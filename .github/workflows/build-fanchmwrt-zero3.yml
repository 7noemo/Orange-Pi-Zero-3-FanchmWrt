#
# Build FanchmWrt firmware for Orange Pi Zero 3 (Allwinner H618)
#
# 底座：fanchmwrt/fanchmwrt 的 fanchmwrt-25.12.6 分支（OpenWrt 25.12.6 / kernel 6.12）
# 相比 OpenWrt 官方多出：fwx DPI 引擎（kmod-fwx + fwxd）、行为管理 / 上网审计
# 全套 LuCI、自研主题、应用中心、fullcone NAT、shortcut-fe 快转
#
# Wi-Fi（板载 AW859A / UWE5622）由 diy-part1.sh 引入驱动与固件、
# diy-part2.sh 落设备树补丁，两者都依赖本仓的 package/ 与 patches/ 目录
#

name: Build FanchmWrt Zero 3

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      branch:
        description: 'FanchmWrt 源码分支'
        required: false
        default: 'fanchmwrt-25.12.6'

permissions:
  contents: write

env:
  REPO_URL: https://github.com/fanchmwrt/fanchmwrt
  REPO_BRANCH: ${{ github.event.inputs.branch || 'fanchmwrt-25.12.6' }}
  FEEDS_CONF: ''
  CONFIG_FILE: zero3-fanchmwrt.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clean up disk space
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker system prune -a -f
        df -h

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install --no-install-recommends \
          ack antlr3 asciidoc autoconf automake autopoint binutils bison \
          build-essential bzip2 ccache cmake cpio curl device-tree-compiler \
          fastjar flex gawk gettext gcc-multilib g++-multilib git gperf \
          haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
          libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
          libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip \
          p7zip-full patch pkgconf python3 python3-pyelftools \
          python3-setuptools qemu-utils rsync scons squashfs-tools \
          subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code (Shallow Clone)
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone --depth 1 --filter=blob:none "$REPO_URL" -b "$REPO_BRANCH" openwrt
        ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"
        cd openwrt && echo "source: $REPO_BRANCH @ $(git rev-parse --short HEAD)"

    - name: Load custom feeds (diy-part1)
      run: |
        chmod +x "$DIY_P1_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P1_SH"

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration (diy-part2)
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e "$CONFIG_FILE" ] && mv "$CONFIG_FILE" openwrt/.config
        chmod +x "$DIY_P2_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P2_SH"

    - name: make defconfig
      run: |
        cd openwrt
        make defconfig

    - name: Verify key packages in .config
      run: |
        cd openwrt
        fail=0
        for p in fwxd kmod-fwx luci-theme-fanchmwrt luci-app-fwx-dashboard luci-app-fwx-appfilter \
                 luci-app-fwx-wireless luci-app-fwx-app-center \
                 luci-app-passwall2 xray-core luci-compat \
                 kmod-uwe5622 uwe5622-firmware \
                 luci-app-ttyd luci-app-samba4 luci-app-dockerman \
                 luci-i18n-base-zh-cn; do
          if grep -q "^CONFIG_PACKAGE_$p=y" .config; then
            echo "OK: $p enabled"
          elif grep -q "^# CONFIG_PACKAGE_$p is not set" .config; then
            echo "FAIL: $p exists but was dropped by defconfig (unmet dependency):"
            grep -A30 "^config PACKAGE_$p\$" tmp/.config-package.in | head -35
            fail=1
          else
            echo "FAIL: $p not found in package metadata (feed not installed?)"
            fail=1
          fi
        done
        grep -q "^CONFIG_LUCI_LANG_zh_Hans=y" .config && echo "OK: LuCI zh_Hans language enabled" || { echo "FAIL: zh_Hans missing"; fail=1; }
        grep -q "^CONFIG_TARGET_sunxi_cortexa53_DEVICE_xunlong_orangepi-zero3=y" .config \
          && echo "OK: target = Orange Pi Zero 3" || { echo "FAIL: wrong target device"; fail=1; }
        [ "$fail" -eq 0 ] || exit 1

    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j$(nproc) || make download -j8 V=s
        find dl -size -1024c -delete

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo "Using $(($(nproc) - 1)) cores for compilation"
        make -j$(($(nproc) - 1)) || make -j2 || make -j1 V=s
        echo "status=success" >> "$GITHUB_OUTPUT"
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"

    - name: Check build output & Wi-Fi symbols
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt/bin/targets/*/*
        ls -lh *.img.gz 2>/dev/null || true
        echo "--- manifest 里的 Wi-Fi / fwx 关键包 ---"
        grep -E "^(kmod-uwe5622|uwe5622-firmware|kmod-fwx|fwxd|luci-theme-fanchmwrt|luci-app-fwx-dashboard|luci-app-passwall2|xray-core) " \
          *.manifest || echo "(manifest 中未找到，请检查)"

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: FanchmWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success'
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: FanchmWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
        if-no-files-found: error

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> "$GITHUB_OUTPUT"
        touch release.txt
        echo "- Orange Pi Zero 3 (H618) / FanchmWrt $REPO_BRANCH" >> release.txt
        echo "- 板载 Wi-Fi（AW859A / UWE5622）可用：wlan0 支持 2.4G/5G" >> release.txt
        echo "- 内置 fwx DPI 引擎：应用过滤、上网审计、终端流量与时长统计、应用中心" >> release.txt
        echo "- 预装：PassWall2(Xray) / Samba4 / aria2+AriaNg / Docker / ttyd / Tailscale / UPnP / DDNS / WOL" >> release.txt
        echo "- 默认地址 http://192.168.1.1 ，首次登录无密码，请立即设置" >> release.txt
        echo "- 1GB~4GB 内存版本通用；起不来先看 README 的串口排查表" >> release.txt
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      continue-on-error: true
      with:
        retain_days: 0
        keep_minimum_runs: 2

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      continue-on-error: true
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Post-cleanup
      run: |
        sudo rm -rf /workdir/openwrt/dl
        df -h
